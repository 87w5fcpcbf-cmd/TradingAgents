# PAPER TRADING ONLY. Secrets come from .env (chmod 600, never committed).
services:
  bot:
    build: .
    command: ["run", "--strategy", "/app/strategy.md"]
    # To paper trade an unvalidated strategy, append "--allow-unvalidated" (not recommended).
    env_file: .env
    volumes:
      - ./data:/data
      - ./strategy.md:/app/strategy.md:ro
    restart: unless-stopped
  dashboard:
    build: .
    command: ["dashboard", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    volumes:
      - ./data:/data
    # Localhost only. For phone access use Tailscale (`tailscale serve`) rather than opening this port.
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
